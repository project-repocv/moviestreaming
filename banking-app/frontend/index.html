<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Banking Application</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        @media (max-width: 768px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .card h2 {
            color: #667eea;
            margin-bottom: 20px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .account-list {
            list-style: none;
        }

        .account-item {
            padding: 15px;
            border: 1px solid #e0e0e0;
            border-radius: 5px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .account-item:hover {
            background: #f5f5f5;
            transform: translateX(5px);
        }

        .account-item.selected {
            background: #667eea;
            color: white;
        }

        .account-number {
            font-weight: bold;
            font-size: 1.2em;
        }

        .account-name {
            color: #666;
            margin-top: 5px;
        }

        .account-item.selected .account-name {
            color: #e0e0e0;
        }

        .balance {
            font-size: 1.5em;
            color: #27ae60;
            font-weight: bold;
            margin-top: 10px;
        }

        .account-item.selected .balance {
            color: #90ee90;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
            font-size: 1em;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            width: 100%;
            margin-top: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .transaction-list {
            max-height: 300px;
            overflow-y: auto;
        }

        .transaction-item {
            padding: 10px;
            border-left: 3px solid #667eea;
            background: #f9f9f9;
            margin-bottom: 10px;
            border-radius: 0 5px 5px 0;
        }

        .transaction-item.deposit {
            border-left-color: #27ae60;
        }

        .transaction-item.withdrawal {
            border-left-color: #e74c3c;
        }

        .transaction-item.transfer_in {
            border-left-color: #3498db;
        }

        .transaction-item.transfer_out {
            border-left-color: #e67e22;
        }

        .transaction-type {
            font-weight: bold;
            text-transform: capitalize;
        }

        .transaction-amount {
            font-size: 1.1em;
            margin-top: 5px;
        }

        .transaction-amount.positive {
            color: #27ae60;
        }

        .transaction-amount.negative {
            color: #e74c3c;
        }

        .message {
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .actions-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        .action-btn {
            padding: 15px;
            font-size: 0.9em;
        }

        .no-account {
            text-align: center;
            color: #999;
            padding: 40px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🏦 Simple Banking Application</h1>
            <p>Manage your accounts with ease</p>
        </header>

        <div id="message" class="message"></div>

        <div class="dashboard">
            <div class="card">
                <h2>📋 Accounts</h2>
                <ul class="account-list" id="accountList">
                    <li class="no-account">Loading accounts...</li>
                </ul>
            </div>

            <div class="card" id="accountDetails">
                <h2>💼 Account Details</h2>
                <div id="selectedAccountInfo">
                    <p class="no-account">Select an account to view details</p>
                </div>

                <div id="accountActions" style="display: none;">
                    <div class="actions-grid">
                        <button class="action-btn" onclick="showAction('deposit')">💰 Deposit</button>
                        <button class="action-btn" onclick="showAction('withdraw')">💸 Withdraw</button>
                        <button class="action-btn" onclick="showAction('transfer')">🔄 Transfer</button>
                    </div>

                    <div id="actionForm" style="margin-top: 20px; display: none;">
                        <h3 id="actionTitle" style="margin-bottom: 15px; color: #667eea;"></h3>
                        
                        <div id="depositForm" class="action-form" style="display: none;">
                            <div class="form-group">
                                <label>Amount</label>
                                <input type="number" id="depositAmount" placeholder="Enter amount" min="0.01" step="0.01">
                            </div>
                            <button onclick="performDeposit()">Confirm Deposit</button>
                        </div>

                        <div id="withdrawForm" class="action-form" style="display: none;">
                            <div class="form-group">
                                <label>Amount</label>
                                <input type="number" id="withdrawAmount" placeholder="Enter amount" min="0.01" step="0.01">
                            </div>
                            <button onclick="performWithdraw()">Confirm Withdrawal</button>
                        </div>

                        <div id="transferForm" class="action-form" style="display: none;">
                            <div class="form-group">
                                <label>To Account</label>
                                <select id="transferToAccount"></select>
                            </div>
                            <div class="form-group">
                                <label>Amount</label>
                                <input type="number" id="transferAmount" placeholder="Enter amount" min="0.01" step="0.01">
                            </div>
                            <button onclick="performTransfer()">Confirm Transfer</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="card">
            <h2>📊 Transaction History</h2>
            <div class="transaction-list" id="transactionList">
                <p class="no-account">No transactions yet</p>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:5000/api';
        let selectedAccount = null;
        let allAccounts = [];

        // Load all accounts
        async function loadAccounts() {
            try {
                const response = await fetch(`${API_URL}/accounts`);
                const accounts = await response.json();
                allAccounts = accounts;
                renderAccountList(accounts);
                updateTransferDropdown(accounts);
            } catch (error) {
                showMessage('Failed to load accounts. Make sure the backend server is running.', 'error');
            }
        }

        // Render account list
        function renderAccountList(accounts) {
            const accountList = document.getElementById('accountList');
            accountList.innerHTML = '';

            accounts.forEach(account => {
                const li = document.createElement('li');
                li.className = 'account-item';
                if (selectedAccount && selectedAccount.account_number === account.account_number) {
                    li.classList.add('selected');
                }
                li.onclick = () => selectAccount(account);
                li.innerHTML = `
                    <div class="account-number">Account: ${account.account_number}</div>
                    <div class="account-name">${account.name}</div>
                    <div class="balance">$${account.balance.toFixed(2)}</div>
                `;
                accountList.appendChild(li);
            });
        }

        // Select an account
        function selectAccount(account) {
            selectedAccount = account;
            loadAccountDetails(account.account_number);
            renderAccountList(allAccounts);
        }

        // Load account details
        async function loadAccountDetails(accountNumber) {
            try {
                const response = await fetch(`${API_URL}/accounts/${accountNumber}`);
                const account = await response.json();
                selectedAccount = account;
                renderAccountDetails(account);
                renderTransactions(account.transactions);
            } catch (error) {
                showMessage('Failed to load account details', 'error');
            }
        }

        // Render account details
        function renderAccountDetails(account) {
            const infoDiv = document.getElementById('selectedAccountInfo');
            infoDiv.innerHTML = `
                <div class="form-group">
                    <label>Account Number</label>
                    <input type="text" value="${account.account_number}" readonly>
                </div>
                <div class="form-group">
                    <label>Account Holder</label>
                    <input type="text" value="${account.name}" readonly>
                </div>
                <div class="form-group">
                    <label>Current Balance</label>
                    <div class="balance">$${account.balance.toFixed(2)}</div>
                </div>
            `;
            document.getElementById('accountActions').style.display = 'block';
        }

        // Render transactions
        function renderTransactions(transactions) {
            const transactionList = document.getElementById('transactionList');
            
            if (!transactions || transactions.length === 0) {
                transactionList.innerHTML = '<p class="no-account">No transactions yet</p>';
                return;
            }

            transactionList.innerHTML = '';
            
            // Show latest transactions first
            [...transactions].reverse().forEach(transaction => {
                const div = document.createElement('div');
                div.className = `transaction-item ${transaction.type}`;
                
                let amountDisplay = '';
                let amountClass = '';
                
                if (transaction.type === 'deposit' || transaction.type === 'transfer_in') {
                    amountDisplay = `+$${transaction.amount.toFixed(2)}`;
                    amountClass = 'positive';
                } else {
                    amountDisplay = `-$${transaction.amount.toFixed(2)}`;
                    amountClass = 'negative';
                }

                let description = transaction.type.replace('_', ' ');
                if (transaction.to_account) {
                    description += ` to ${transaction.to_account}`;
                }
                if (transaction.from_account) {
                    description += ` from ${transaction.from_account}`;
                }

                div.innerHTML = `
                    <div class="transaction-type">${description}</div>
                    <div class="transaction-amount ${amountClass}">${amountDisplay}</div>
                    <div style="font-size: 0.9em; color: #666; margin-top: 5px;">Balance after: $${transaction.balance_after.toFixed(2)}</div>
                `;
                transactionList.appendChild(div);
            });
        }

        // Update transfer dropdown
        function updateTransferDropdown(accounts) {
            const select = document.getElementById('transferToAccount');
            select.innerHTML = '';
            
            accounts.forEach(account => {
                if (!selectedAccount || account.account_number !== selectedAccount.account_number) {
                    const option = document.createElement('option');
                    option.value = account.account_number;
                    option.textContent = `${account.account_number} - ${account.name}`;
                    select.appendChild(option);
                }
            });
        }

        // Show action form
        function showAction(action) {
            // Hide all forms
            document.querySelectorAll('.action-form').forEach(form => {
                form.style.display = 'none';
            });

            // Show selected form
            const formId = `${action}Form`;
            document.getElementById(formId).style.display = 'block';
            document.getElementById('actionTitle').textContent = 
                action.charAt(0).toUpperCase() + action.slice(1);
        }

        // Perform deposit
        async function performDeposit() {
            const amount = parseFloat(document.getElementById('depositAmount').value);
            
            if (!amount || amount <= 0) {
                showMessage('Please enter a valid amount', 'error');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/accounts/${selectedAccount.account_number}/deposit`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ amount })
                });

                const result = await response.json();
                
                if (response.ok) {
                    showMessage('Deposit successful!', 'success');
                    loadAccountDetails(selectedAccount.account_number);
                    renderAccountList(allAccounts);
                    document.getElementById('depositAmount').value = '';
                } else {
                    showMessage(result.error || 'Deposit failed', 'error');
                }
            } catch (error) {
                showMessage('Failed to process deposit', 'error');
            }
        }

        // Perform withdrawal
        async function performWithdraw() {
            const amount = parseFloat(document.getElementById('withdrawAmount').value);
            
            if (!amount || amount <= 0) {
                showMessage('Please enter a valid amount', 'error');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/accounts/${selectedAccount.account_number}/withdraw`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ amount })
                });

                const result = await response.json();
                
                if (response.ok) {
                    showMessage('Withdrawal successful!', 'success');
                    loadAccountDetails(selectedAccount.account_number);
                    renderAccountList(allAccounts);
                    document.getElementById('withdrawAmount').value = '';
                } else {
                    showMessage(result.error || 'Withdrawal failed', 'error');
                }
            } catch (error) {
                showMessage('Failed to process withdrawal', 'error');
            }
        }

        // Perform transfer
        async function performTransfer() {
            const toAccount = document.getElementById('transferToAccount').value;
            const amount = parseFloat(document.getElementById('transferAmount').value);
            
            if (!toAccount) {
                showMessage('Please select a destination account', 'error');
                return;
            }
            
            if (!amount || amount <= 0) {
                showMessage('Please enter a valid amount', 'error');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/transfer`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        from_account: selectedAccount.account_number,
                        to_account: toAccount,
                        amount 
                    })
                });

                const result = await response.json();
                
                if (response.ok) {
                    showMessage('Transfer successful!', 'success');
                    loadAccountDetails(selectedAccount.account_number);
                    renderAccountList(allAccounts);
                    document.getElementById('transferAmount').value = '';
                } else {
                    showMessage(result.error || 'Transfer failed', 'error');
                }
            } catch (error) {
                showMessage('Failed to process transfer', 'error');
            }
        }

        // Show message
        function showMessage(text, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = text;
            messageDiv.className = `message ${type}`;
            messageDiv.style.display = 'block';
            
            setTimeout(() => {
                messageDiv.style.display = 'none';
            }, 5000);
        }

        // Initialize
        loadAccounts();
        setInterval(loadAccounts, 10000); // Refresh every 10 seconds
    </script>
</body>
</html>
