apiVersion: v1
kind: ConfigMap
metadata:
  name: cinevision-config
  namespace: cinevision-dev
data:
  # Common configuration
  SPRING_PROFILES_ACTIVE: "kubernetes"
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eureka-server.cinevision-dev.svc.cluster.local:8761/eureka"
  KAFKA_BOOTSTRAP_SERVERS: "kafka.cinevision-dev.svc.cluster.local:9092"   # if Kafka is in cluster

  # Service-specific overrides (can be used if needed)
  MOVIE_SERVICE_DB_NAME: "cinevision_movies"
  USER_SERVICE_DB_NAME: "cinevision_users"
  API_GATEWAY_PORT: "8080"
  EUREKA_SERVER_PORT: "8761"
  FRONTEND_PORT: "80"