apiVersion: apps/v1
kind: Deployment
metadata:
  name: movieservice
  namespace: cinevision-dev
  labels:
    app: movieservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: movieservice
  template:
    metadata:
      labels:
        app: movieservice
    spec:
      containers:
      - name: movieservice
        image: 590396427103.dkr.ecr.us-east-1.amazonaws.com/cinevision/movieservice:latest
        ports:
        - containerPort: 8081
        env:
        - name: SERVER_PORT
          value: "8081"
        - name: SPRING_PROFILES_ACTIVE
          valueFrom:
            configMapKeyRef:
              name: cinevision-config
              key: SPRING_PROFILES_ACTIVE
        - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
          valueFrom:
            configMapKeyRef:
              name: cinevision-config
              key: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:postgresql://postgres.cinevision-dev.svc.cluster.local:5432/cinevision_movies"
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: cinevision-secrets
              key: DB_USERNAME
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: cinevision-secrets
              key: DB_PASSWORD
        - name: DB_URL
          value: "jdbc:postgresql://postgres.cinevision-dev.svc.cluster.local:5432/cinevision_movies"
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: cinevision-secrets
              key: DB_USERNAME
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: cinevision-secrets
              key: DB_PASSWORD
        - name: KAFKA_BOOTSTRAP_SERVERS
          valueFrom:
            configMapKeyRef:
              name: cinevision-config
              key: KAFKA_BOOTSTRAP_SERVERS
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8081
          initialDelaySeconds: 60
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8081
          initialDelaySeconds: 30
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: movieservice
  namespace: cinevision-dev
spec:
  selector:
    app: movieservice
  ports:
  - port: 8081
    targetPort: 8081
  type: ClusterIP