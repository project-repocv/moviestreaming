apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cinevision-ingress
  namespace: cinevision-dev
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx   # if using NGINX Ingress Controller
  rules:
  - host: dev.cinevision.com   # replace with your domain or use a wildcard
    http:
      paths:
      - path: /api(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: api-gateway
            port:
              number: 8080
      - path: /(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: frontend
            port:
              number: 80