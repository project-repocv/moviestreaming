apiVersion: apps/v1
kind: Deployment
metadata:
  name: userservice
  namespace: cinevision-dev
  labels:
    app: userservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: userservice
  template:
    metadata:
      labels:
        app: userservice
    spec:
      containers:
      - name: userservice
        image: 781863585922.dkr.ecr.us-east-1.amazonaws.com/cinevision/userservice:latest
        ports:
        - containerPort: 8082
        env:
        - name: SERVER_PORT
          value: "8082"
        - name: SPRING_PROFILES_ACTIVE
          valueFrom:
            configMapKeyRef:
              name: cinevision-config
              key: SPRING_PROFILES_ACTIVE
        - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
          valueFrom:
            configMapKeyRef:
              name: cinevision-config
              key: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
        - name: DB_URL
          value: "jdbc:postgresql://postgres.cinevision-dev.svc.cluster.local:5432/cinevision_users"
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: cinevision-secrets
              key: DB_USERNAME
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: cinevision-secrets
              key: DB_PASSWORD
        - name: JWT_PRIVATE_KEY
          valueFrom:
            secretKeyRef:
              name: cinevision-secrets
              key: JWT_PRIVATE_KEY
        - name: JWT_PUBLIC_KEY
          valueFrom:
            secretKeyRef:
              name: cinevision-secrets
              key: JWT_PUBLIC_KEY
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8082
          initialDelaySeconds: 60
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8082
          initialDelaySeconds: 30
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: userservice
  namespace: cinevision-dev
spec:
  selector:
    app: userservice
  ports:
  - port: 8082
    targetPort: 8082
  type: ClusterIP